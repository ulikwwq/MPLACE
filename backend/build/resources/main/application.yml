spring:
  application:
    name: backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/mplace}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgress_user}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    hibernate:
      # Flyway (db/migration) now owns the schema. Never "create"/"update".
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: INFO
    com.mplace.backend: DEBUG

# Not used by MockOneCClient (the active bean for the MVP), but wired up
# and ready for when HttpOneCClient replaces it. Never hardcode these.
onec:
  base-url: ${ONEC_BASE_URL:}
  username: ${ONEC_USERNAME:}
  password: ${ONEC_PASSWORD:}

app:
  cors:
    # Comma-separated list of allowed frontend origins. Defaults to the
    # standard Vite dev server port for local development.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
